[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanket"
version = "0.1.0"
description = "Support-ticket triage for a bank"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.4.6", "pandas==3.1.1", "scikit-learn==1.9.1", "joblib==1.6.0", "pyyaml==6.0.3", "fastapi==0.163.0", "uvicorn==0.54.0",
  "sqlalchemy==2.1.8", "pydantic==2.14.3", "pydantic-settings==2.16.3", "onnxruntime==1.32.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.5", "markdown==3.11.3"]
train = ["torch==2.15.0", "onnx==1.23.2"]

[tool.setuptools.packages.find]
include = ["sanket*"]

[tool.setuptools.package-data]
sanket = ["taxonomy.yaml", "sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
